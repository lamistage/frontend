<mat-toolbar>
    <span class="pm-label">pm</span>
    <button class="burger-button" mat-icon-button [matMenuTriggerFor]="menu" aria-label="Icon-button with a menu">
        <mat-icon>menu</mat-icon>
    </button>
    <mat-menu #menu="matMenu">
        <button mat-menu-item [routerLink]="['/profile']">
            <mat-icon>person</mat-icon>
            <span>profile</span>
        </button>
        <button mat-menu-item [routerLink]="['/gallery']">
            <mat-icon>photo_library</mat-icon>
            <span>gallery</span>
        </button>
        <button mat-menu-item [routerLink]="['/add-image']">
            <mat-icon>add_to_photos</mat-icon>
            <span>add-image</span>
        </button>
        <button mat-menu-item (click)="logout()">
            <mat-icon>exit_to_app</mat-icon>
            <span>logout</span>
        </button>
    </mat-menu>
</mat-toolbar>

<h1>Profile</h1>

<div class="container">
    <div class="search-items">
        <div class="search-item">
            <mat-form-field class="tag-list">
                <mat-label>tags</mat-label>
                <mat-chip-grid #tagChipGrid aria-label="Enter tags">
                    @for (tag of tags(); track tag) {
                        <mat-chip-row
                            (removed)="remove_tag(tag)"
                            [editable]="true"
                            (edited)="edit_tag(tag, $event)"
                            [aria-description]="'press enter to edit ' + tag.name"
                        >
                        {{tag.name}}
                        <button matChipRemove [attr.aria-label]="'remove ' + tag.name">
                        <mat-icon>cancel</mat-icon>
                        </button>
                    </mat-chip-row>
                    }
                    <input
                    placeholder="new tag..."
                    [formControl]="tagCtrl"
                    [matChipInputFor]="tagChipGrid"
                    [matAutocomplete]="tagAuto"
                    [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
                    [matChipInputAddOnBlur]="addOnBlur"
                    (matChipInputTokenEnd)="add_tag($event)"
                    />  
                </mat-chip-grid>
                <mat-autocomplete #tagAuto="matAutocomplete" (optionSelected)="selectedTag($event)">
                    @for (tag of filteredTags | async; track tag) {
                        <mat-option [value]="tag.name">{{tag.name}}</mat-option>
                    }
                </mat-autocomplete>
            </mat-form-field>
        </div>

        <div class="search-item">
            <mat-form-field>
                <mat-label>sorting order</mat-label>
                <mat-select [(value)]="selectedSort">
                    @for (sortType of sortTypes; track sortType) {
                        <mat-option [value]="sortType.value">{{sortType.viewValue}}</mat-option>
                    }
                </mat-select>
            </mat-form-field>
        </div>

        <div class="search-item search-button">
            <button (click)="loadImages()">
                <mat-icon>search</mat-icon>
            </button>
        </div>
    </div>

    <div class="gallery">
        <p *ngIf="isLoading()">loading..</p>

        @for (publication of images(); track publication.id) {
            <app-publication 
            [publication]="publication" 
            [isProfilePage]="true"
            (deleted)="onPublicationDeleted($event)">
        </app-publication>
        }
    </div>
</div>
