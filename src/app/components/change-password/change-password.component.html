<div *ngIf="isDialogOpen()" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h2 class="modal-title">Change Password</h2>
            <button class="close-btn" (click)="closeChangePasswordDialog()">
                <span>&times;</span>
            </button>
        </div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="change-password-form">
            <div class="form-field">
                <label for="currentPassword">Current Password</label>
                <input
                    id="currentPassword"
                    type="password"
                    formControlName="currentPassword"
                    (input)="onInputCurrentPassword($event)"
                    placeholder="Enter current password"
                    [class.invalid]="form.get('currentPassword')?.touched && form.get('currentPassword')?.invalid"
                />
            </div>

            <div class="form-field">
                <label for="newPassword">New Password</label>
                <input
                    id="newPassword"
                    type="password"
                    formControlName="newPassword"
                    (input)="onInputNewPassword($event)"
                    placeholder="Enter new password"
                    [class.invalid]="form.get('newPassword')?.touched && form.get('newPassword')?.invalid"
                />
            </div>

            <div class="success-message" *ngIf="successMessage">
                {{ successMessage }}
            </div>

            <div class="server-error" *ngIf="errorMessage">
                {{ errorMessage }}
            </div>

            <div class="form-actions">
                <button type="button" class="cancel-btn" (click)="closeChangePasswordDialog()">Cancel</button>
                <button type="submit" class="submit-btn" [disabled]="form.invalid">Submit</button>
            </div>
        </form>
    </div>
</div>
